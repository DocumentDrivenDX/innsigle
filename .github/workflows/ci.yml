# Test gate for pull requests and main. Deploy microsite (pages.yml) still
# re-runs tests before publishing GitHub Pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Unit / integration tests
        run: npm test

      - name: Seal generated sources (build key)
        env:
          INNSIGLE_BUILD_KEY: ${{ secrets.INNSIGLE_BUILD_KEY }}
        run: |
          if [ -n "$INNSIGLE_BUILD_KEY" ]; then
            node src/cli.mjs seal --all --role build
          else
            echo "No INNSIGLE_BUILD_KEY; using committed generated claims"
          fi

      - name: Verify microsite seals
        run: npm run verify:site

      - name: Playwright e2e (link integrity + design voice + profile builder)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
